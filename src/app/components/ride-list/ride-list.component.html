<div class="ride-container">
  <div class="ride-count-header">
    Showing {{ rides.length }} rides
  </div>

  <div class="ride-list" *ngIf="rides.length > 0">
    <app-ride-card
      *ngFor="let ride of rides"
      [ride]="ride"
    ></app-ride-card>
  </div>

  <div class="ride-not-found" *ngIf="rides.length === 0">
    <div class="ride-not-found-icon">
      <i class="material-icons">search_off</i>
    </div>
    <div class="ride-not-found-title">No rides found</div>
    <div class="ride-not-found-subtitle">
      Try adjusting your filters or add a new ride
    </div>
  </div>
</div>
